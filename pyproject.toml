[project]
name = "pytorch-demo"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.0",
    "torchvision (==0.29.0)",
    "numpy (==2.5.2)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "pandas (>=3.0.5,<4.0.0)"
]

[project.optional-dependencies]
onnx = ["onnx==1.22.0", "onnxscript==0.7.1"]

[tool.poetry]
# Dependency management only. This repo is not an installable package.
package-mode = false

[[tool.poetry.source]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch-cu130"}
torchvision = {source = "pytorch-cu130"}

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
